steps:
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'artifacts'
      - 'repositories'
      - 'create'
      - 'pelican-travels'
      - '--repository-format=docker'
      - '--location=us-central1'
      - '--quiet'
    allowFailure: true
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--build-arg'
      - 'NEXT_PUBLIC_FIREBASE_API_KEY=AIzaSyCGXRZHOJUnKRSXrmTQB16BOdw9AZHvkm4'
      - '--build-arg'
      - 'NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=pelican-tours-68819.firebaseapp.com'
      - '--build-arg'
      - 'NEXT_PUBLIC_FIREBASE_PROJECT_ID=pelican-tours-68819'
      - '--build-arg'
      - 'NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=pelican-tours-68819.firebasestorage.app'
      - '--build-arg'
      - 'NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=417622467386'
      - '--build-arg'
      - 'NEXT_PUBLIC_FIREBASE_APP_ID=1:417622467386:web:b8f47a750cbba871e8e603'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/pelican-travels/app'
      - '.'
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'us-central1-docker.pkg.dev/$PROJECT_ID/pelican-travels/app']
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'pelican-travels'
      - '--image'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/pelican-travels/app'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--port'
      - '3000'
      - '--allow-unauthenticated'
images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/pelican-travels/app'
timeout: '1800s'
options:
  logging: CLOUD_LOGGING_ONLY
